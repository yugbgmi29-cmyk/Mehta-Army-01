<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝐌𝐄𝐇𝐓𝐀~𝐀𝐑𝐌𝐘 𝟐.𝟎 💸</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0c0d11;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.08) 0%, transparent 60%),
                radial-gradient(2px 2px at 20px 30px, rgba(255, 255, 255, 0.3), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, rgba(255, 255, 255, 0.2), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, rgba(255, 255, 255, 0.4), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, rgba(255, 255, 255, 0.3), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px, 100% 100%, 100% 100%, 100% 100%, 100% 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 25px 15px;
        }

        .container {
            width: 100%;
            max-width: 410px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Live Badge */
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #d1d5db;
            margin-bottom: 25px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: #a1a1aa;
            border-radius: 50%;
        }

        /* Profile Avatar */
        .avatar-box {
            position: relative;
            width: 135px;
            height: 135px;
            border-radius: 50%;
            margin-bottom: 22px;
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.12);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        /* Channel Titles */
        .main-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .sub-title {
            font-size: 14px;
            color: #9ca3af;
            font-weight: 400;
            margin-bottom: 25px;
        }

        /* Divider Line */
        .divider {
            width: 50px;
            height: 2px;
            background: rgba(255, 255, 255, 0.2);
            margin-bottom: 25px;
            border-radius: 2px;
        }

        /* Dark Join Button */
        .join-btn {
            width: 100%;
            padding: 18px;
            background: #1e222b;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 18px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-decoration: none;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            display: block;
            transition: transform 0.2s ease, background 0.2s ease;
            animation: pulseBtn 2s infinite;
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); background: #252a36; }
            100% { transform: scale(1); }
        }

        .join-btn:active {
            transform: scale(0.98);
        }

        /* Expiry Box */
        .timer-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px 15px;
            margin-bottom: 35px;
        }

        .timer-label {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 6px;
        }

        .timer-val {
            font-size: 34px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .timer-subtext {
            font-size: 12px;
            color: #6b7280;
            line-height: 1.4;
            max-width: 250px;
            margin: 0 auto;
        }

        /* Bottom Stats */
        .stats-grid {
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 30px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-num {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .stat-lbl {
            font-size: 10px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-divider {
            width: 1px;
            height: 25px;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Footer */
        .footer {
            font-size: 11px;
            color: #4b5563;
            line-height: 1.6;
        }

        .footer a {
            color: #6b7280;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="live-badge">
            <span class="live-dot"></span> LIVE NOW
        </div>

        <div class="avatar-box">
            <img src="https://i.ibb.co/bwqWyhB/IMG-20260828-014912-988.jpg" class="avatar-img" alt="Profile Avatar">
        </div>

        <h1 class="main-title">𝐌𝐄𝐇𝐓𝐀~𝐀𝐑𝐌𝐘 𝟐.𝟎 💸</h1>
        <p class="sub-title">Your Premium Gaming Destination 🎰</p>

        <div class="divider"></div>

        <a href="https://telegram.me/+JllBiaOdHN05N2U9" class="join-btn">
            JOIN NOW
        </a>

        <div class="timer-card">
            <div class="timer-label">Time Left For Free Join</div>
            <div class="timer-val" id="timer">00:16</div>
            <div class="timer-subtext">Offer starts counting down as soon as you open the page.</div>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <span class="stat-num">50K+</span>
                <span class="stat-lbl">MEMBERS</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <span class="stat-num">24/7</span>
                <span class="stat-lbl">SUPPORT</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <span class="stat-num">100%</span>
                <span class="stat-lbl">SECURE</span>
            </div>
        </div>

        <div class="footer">
            © 2026 All rights reserved.<br>
            Ads Managed By <a href="https://t.me/senorita_xoxo" target="_blank">@senorita_xoxo</a>
        </div>
    </div>

    <script>
        let timeLeft = 16;
        const timerElement = document.getElementById('timer');

        const countdown = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.textContent = "00:00";
            } else {
                timeLeft--;
                let seconds = timeLeft < 10 ? '0' + timeLeft : timeLeft;
                timerElement.textContent = `00:${seconds}`;
            }
        }, 1000);
    </script>
</body>
</html>
