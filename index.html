    <style>
        :root {
            --bg-dark: #070913;
            --card-bg: rgba(15, 18, 33, 0.75);
            --card-border: rgba(120, 119, 198, 0.25);
            --cyan-glow: #00F0FF;
            --purple-glow: #7000FF;
            --text-blue: #38BDF8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(112, 0, 255, 0.18) 0%, transparent 60%),
                radial-gradient(circle at 50% 70%, rgba(0, 240, 255, 0.12) 0%, transparent 60%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 20px 15px;
        }

        .wrapper {
            width: 100%;
            max-width: 410px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Main Card */
        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 40px 24px 30px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.02);
        }

        /* Top Tagline */
        .top-tag {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 5px;
            color: #6366F1;
            text-transform: uppercase;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Avatar Box with Glowing Border */
        .avatar-box {
            position: relative;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(180deg, var(--cyan-glow) 0%, var(--purple-glow) 100%);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.4), 0 0 50px rgba(112, 0, 255, 0.3);
            margin-bottom: 25px;
            animation: pulseGlow 3s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 25px rgba(0, 240, 255, 0.3), 0 0 45px rgba(112, 0, 255, 0.2); }
            100% { box-shadow: 0 0 40px rgba(0, 240, 255, 0.6), 0 0 65px rgba(112, 0, 255, 0.5); }
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #090B16;
        }

        /* Channel Main Title */
        .main-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #FFFFFF;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        /* Sub Headline */
        .sub-headline {
            font-size: 14px;
            color: #94A3B8;
            margin-bottom: 28px;
            font-weight: 500;
        }

        .sub-headline span {
            color: var(--text-blue);
            font-weight: 600;
        }

        /* CTA Button */
        .join-btn {
            width: 100%;
            padding: 18px 20px;
            background: linear-gradient(90deg, #7C3AED 0%, #2563EB 100%);
            border-radius: 16px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.4);
            animation: ctaPulse 2s infinite;
            transition: all 0.3s ease;
        }

        @keyframes ctaPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); box-shadow: 0 12px 35px rgba(37, 99, 235, 0.6); }
        }

        .sub-caption {
            font-size: 12px;
            color: #64748B;
            margin-top: 14px;
        }

        /* Footer */
        .footer {
            text-align: center;
            font-size: 11px;
            color: #475569;
        }

        .footer a {
            color: var(--text-blue);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
