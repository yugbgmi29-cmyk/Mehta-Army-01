<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝐌𝐄𝐇𝐓𝐀~𝐀𝐑𝐌𝐘 𝟐.𝟎 💸</title>

    <style>
        :root {
            --primary-glow: #7C3AED;
            --blue-glow: #2563EB;
            --btn-blue: #0088cc;
            --bg-dark: #07090e;
            --card-bg: rgba(18, 22, 33, 0.75);
            --text-white: #ffffff;
            --text-gray: #94a3b8;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(124, 58, 237, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(37, 99, 235, 0.1) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-white);
            padding: 20px 15px;
        }

        .wrapper {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Hero Glass Card */
        .glass-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 35px 24px 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Neon Profile Image Ring */
        .avatar-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 22px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #a855f7, #3b82f6, #06b6d4);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
            animation: ringGlow 4s ease-in-out infinite alternate;
        }

        @keyframes ringGlow {
            0% { box-shadow: 0 0 20px rgba(168, 85, 247, 0.4); }
            100% { box-shadow: 0 0 35px rgba(59, 130, 246, 0.7); }
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--bg-dark);
        }

        /* Title & Tagline */
        .channel-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            background: linear-gradient(180deg, #FFFFFF 0%, #CBD5E1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .channel-tagline {
            font-size: 13px;
            color: var(--text-gray);
            margin-bottom: 25px;
            font-weight: 500;
        }

        .channel-tagline span {
            color: #38bdf8;
            font-weight: 600;
        }

        /* High CTA Pulsing Join Button */
        .join-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 18px;
            background: linear-gradient(90deg, #229ED9 0%, #0088cc 100%);
            border-radius: 14px;
            color: white;
            font-weight: 800;
            font-size: 17px;
            text-decoration: none;
            letter-spacing: 0.8px;
            box-shadow: 0 8px 25px rgba(34, 158, 217, 0.45);
            animation: ctaPulse 2s infinite;
            transition: transform 0.2s ease;
        }

        .join-btn:active {
            transform: scale(0.98);
        }

        .join-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        @keyframes ctaPulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 158, 217, 0.6); }
            70% { transform: scale(1.02); box-shadow: 0 0 0 16px rgba(34, 158, 217, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 158, 217, 0); }
        }

        .sub-text {
            font-size: 11px;
            color: #64748b;
            margin-top: 12px;
        }

        /* Countdown Card */
        .timer-box {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
        }

        .timer-label { 
            font-size: 11px; 
            font-weight: 700; 
            color: #ef4444; 
            margin-bottom: 4px; 
            letter-spacing: 1px;
        }
        
        .timer-val { 
            font-size: 32px; 
            font-weight: 900; 
            color: #fbbf24; 
            font-variant-numeric: tabular-nums;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 5px;
            border-radius: 14px;
            text-align: center;
        }

        .stat-n { font-size: 15px; font-weight: 800; color: #f8fafc; }
        .stat-l { font-size: 9px; color: var(--text-gray); text-transform: uppercase; margin-top: 3px; }

        /* Footer */
        .footer {
            text-align: center;
            font-size: 11px;
            color: #64748b;
            margin-top: 5px;
        }
        .footer a { color: var(--btn-blue); text-decoration: none; font-weight: 600; }

    </style>
</head>
<body>

    <div class="wrapper">
        <div class="glass-card">
            <div class="avatar-wrapper">
                <img src="https://i.ibb.co/bwqWyhB/IMG-20260828-014912-988.jpg" class="avatar-img" alt="Profile Image">
            </div>

            <h1 class="channel-title">𝐌𝐄𝐇𝐓𝐀~𝐀𝐑𝐌𝐘 𝟐.𝟎 💸</h1>
            <p class="channel-tagline">Enter the guild. <span>Premium signals</span> await.</p>

            <a href="https://telegram.me/+JllBiaOdHN05N2U9" class="join-btn">
                <span>JOIN TELEGRAM</span>
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </a>
            <p class="sub-text">Tap to open Telegram and join instantly</p>
        </div>

        <div class="timer-box">
            <div class="timer-label">⚠️ LINK EXPIRES IN</div>
            <div class="timer-val" id="timer">00:10</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-n">99.9%</div>
                <div class="stat-l">Accuracy</div>
            </div>
            <div class="stat-card">
                <div class="stat-n">24/7</div>
                <div class="stat-l">Support</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-inner">
                    <div class="stat-n">100%</div>
                    <div class="stat-l">Secure</div>
                </div>
            </div>
        </div>

        <div class="footer">
            Ads Managed By <a href="https://t.me/senorita_xoxo" target="_blank">@senorita_xoxo</a>
        </div>
    </div>

    <script>
        let timeLeft = 10;
        const timerElement = document.getElementById('timer');

        const countdown = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.textContent = "00:00";
            } else {
                timeLeft--;
                let seconds = timeLeft < 10 ? '0' + timeLeft : timeLeft;
                timerElement.textContent = `00:${seconds}`;
            }
        }, 1000);
    </script>
</body>
</html>
